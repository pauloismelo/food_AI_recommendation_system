<div class="col-md-3">
    <div class="card product-card">
        <div class="card-body">
            <h5 class="card-title">{{name}}</h5>
            <span class="product-category-badge">{{category}}</span>
            <span class="product-cuisine"><i class="bi bi-globe2"></i> {{cuisine}}</span>
            <div class="product-price">R$ {{price}}</div>
            <button class="btn buy-now-btn" data-product='{{product}}'>
                <i class="bi bi-bag-plus-fill"></i> Add to Order
            </button>
        </div>
    </div>
</div>
